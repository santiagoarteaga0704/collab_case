# Despliegue en AWS EC2: la app (web + API + WebSocket) en el puerto 8080 y Postgres interno.
#
# Variables OBLIGATORIAS (defínelas en un .env junto a este archivo, que NO se versiona):
#   POSTGRES_PASSWORD     contraseña de la base de datos
#   JWT_SECRET            secreto para firmar los tokens (cadena larga y aleatoria)
#   IA_CONECTOR_SECRETO   secreto compartido con conector-ia (vacío = endpoint /ws/ai-connector cerrado)
#   CORS_ALLOWED_ORIGINS  origen público de la web, p. ej. https://collab.midominio.com
#                         (también gobierna los orígenes permitidos de los WebSocket)
#   GEMINI_API_KEY        clave de Gemini (el perfil aws usa Gemini para voz y foto de pizarra; sin ella la app no arranca)
# Opcional:
#   APP_PORT              puerto publicado en el host (por omisión 8080)
#   JAVA_TOOL_OPTIONS     memoria de la JVM (por omisión -Xmx512m, pensado para un t3.micro de 1 GB con swap)
services:
  app:
    image: collab-case:local
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: aws
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/collabcase
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET}
      IA_CONECTOR_SECRETO: ${IA_CONECTOR_SECRETO:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?define CORS_ALLOWED_ORIGINS}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?define GEMINI_API_KEY}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx512m -XX:+UseSerialGC}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: collabcase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collabcase"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
