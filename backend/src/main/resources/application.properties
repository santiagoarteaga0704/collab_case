spring.application.name=backend
spring.config.import=optional:file:./.env[.properties]
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/collabcase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
codegen.spring-boot-version=4.1.1

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

ai.provider=${AI_PROVIDER:ollama}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:180}
ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.ollama.model=${OLLAMA_MODEL:qwen3:4b-instruct}
ai.bedrock.region=${AI_BEDROCK_REGION:${AWS_REGION:us-east-1}}
ai.bedrock.model-id=${AI_BEDROCK_MODEL_ID:${BEDROCK_MODEL_ID:}}
ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.model=${GROQ_LLM_MODEL:openai/gpt-oss-20b}

agent.provider=${AGENT_PROVIDER:ollama}
agent.timeout-seconds=${AGENT_TIMEOUT_SECONDS:90}
agent.ollama.base-url=${AGENT_OLLAMA_BASE_URL:http://localhost:11434}
agent.ollama.model=${AGENT_OLLAMA_MODEL:qwen3:4b-instruct}
agent.groq.base-url=${AGENT_GROQ_BASE_URL:https://api.groq.com/openai/v1}
agent.groq.api-key=${AGENT_GROQ_API_KEY:${GROQ_API_KEY:}}
agent.groq.model=${AGENT_GROQ_MODEL:${AGENT_CLOUD_MODEL:openai/gpt-oss-20b}}

stt.provider=${STT_PROVIDER:local}
stt.timeout-seconds=${STT_TIMEOUT_SECONDS:120}
stt.local.base-url=${STT_LOCAL_BASE_URL:http://localhost:8090}
stt.groq.base-url=${STT_GROQ_BASE_URL:${GROQ_BASE_URL:https://api.groq.com/openai/v1}}
stt.groq.api-key=${STT_GROQ_API_KEY:${GROQ_API_KEY:}}
stt.groq.model=${STT_GROQ_MODEL:${GROQ_STT_MODEL:whisper-large-v3-turbo}}
stt.gemini.base-url=${STT_GEMINI_BASE_URL:${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}}
stt.gemini.api-key=${STT_GEMINI_API_KEY:${GEMINI_API_KEY:}}
stt.gemini.model=${STT_GEMINI_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}
stt.max-file-size=10485760

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

vision.provider=${VISION_PROVIDER:ollama}
vision.timeout-seconds=${VISION_TIMEOUT_SECONDS:180}
vision.max-file-size=10485760
vision.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
vision.ollama.model=${OLLAMA_VISION_MODEL:qwen2.5vl:3b}
vision.groq.base-url=${VISION_GROQ_BASE_URL:${GROQ_BASE_URL:https://api.groq.com/openai/v1}}
vision.groq.api-key=${VISION_GROQ_API_KEY:${GROQ_API_KEY:}}
vision.groq.model=${VISION_GROQ_MODEL:${GROQ_VISION_MODEL:qwen/qwen3.8-27b}}
vision.gemini.base-url=${VISION_GEMINI_BASE_URL:${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}}
vision.gemini.api-key=${VISION_GEMINI_API_KEY:${GEMINI_API_KEY:}}
vision.gemini.model=${VISION_GEMINI_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}

teamai.connector.secret=${IA_CONECTOR_SECRETO:}
